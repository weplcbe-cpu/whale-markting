<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/whale-enterprise-icon-192.png" />
    <link rel="apple-touch-icon" href="/whale-enterprise-icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#12172d" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaiser Whale Marketing</title>
    <script>
      (function () {
        try {
          var theme = 'dark';
          var root = document.documentElement;
          localStorage.setItem('kw_vmm_theme', theme);
          root.classList.add('dark');
          root.dataset.theme = theme;
          root.style.colorScheme = theme;
          if (document.body) {
            document.body.dataset.theme = theme;
            document.body.classList.remove('theme-light');
          }
        } catch (error) {
          document.documentElement.classList.add('dark');
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
  </head>
  <body data-theme="dark">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
