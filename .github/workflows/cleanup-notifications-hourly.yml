name: Cleanup Expired Notifications Hourly

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Invoke cleanup endpoint
        env:
          CLEANUP_CRON_URL: ${{ secrets.CLEANUP_CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CLEANUP_CRON_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "Missing required secrets" >&2
            exit 1
          fi

          HTTP_STATUS=$(curl -sS -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${CLEANUP_CRON_URL}")

          cat response.json

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            echo "Cleanup call failed with status ${HTTP_STATUS}" >&2
            exit 1
          fi

          echo "Cleanup call succeeded with status ${HTTP_STATUS}"